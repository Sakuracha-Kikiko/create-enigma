modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
# Shown in the mod list. Square, 256x256: the source artwork is 1920x1080 with the wordmark about
# 1275 wide, so anything uncropped ends up a thin strip in a 64-pixel tile.
logoFile="logo.png"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6.0.10,)"
    ordering="NONE"
    side="BOTH"

# Required, not optional: PonderSceneMixin injects into net.createmod.ponder.foundation.PonderScene.
# Ponder ships inside Create as a jar-in-jar, so requiring Create already implies it - this is
# spelled out because a mixin whose target is absent fails at class load, not gracefully.
[[dependencies.${mod_id}]]
    modId="ponder"
    type="required"
    versionRange="[1.0.82,)"
    ordering="NONE"
    side="BOTH"

[[mixins]]
    config="create_enigma.mixins.json"
