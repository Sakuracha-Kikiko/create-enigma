# Gradle
# -Djava.net.preferIPv4Stack=true is required on this machine: IPv6 routes to
# Maven Central / maven.neoforged.net are blackholed and reset the connection.
org.gradle.jvmargs=-Xmx2G -Djava.net.preferIPv4Stack=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Parchment (parameter names / javadoc)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
# NeoForge 21.1.250 is deliberate: compiling against the LOWEST version we want to
# support means the jar also runs on 21.1.251+. The shared toolchain cache under
# "Create Test1/.toolchain/gh" already holds this exact version, so switching to
# 21.1.255 would cost a fresh dependency resolve for no compatibility gain.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.250
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Mod properties
mod_id=create_enigma
mod_name=Create: Enigma
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.createenigma
mod_authors=Create: Enigma
mod_description=Registers the machine from Mojang's 2022 Java Edition trailer - the one Create recreated in its Creative Motor ponder as "Mojang's Enigma" - as a real, formable multiblock structure.

# Dependency versions
create_version=6.0.10-281
# Versions below match Create 6.0.10's own gradle.properties. Ponder / Flywheel / Registrate
# are bundled into the Create jar as jar-in-jar, so they are not resolved transitively.
registrate_version=MC1.21-1.3.0+67
ponder_version=1.0.82
flywheel_version=1.0.6
